name: Close development dependency advisories
on:
  push:
    branches: [feat/oss-productization-b-20260916]
    paths: ['.github/workflows/dependency-maintenance.yml']
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p evidence
      - name: Record previous tree and audit
        run: |
          git rev-parse HEAD > evidence/input-head.txt
          npm audit --json > evidence/audit-before.json || true
      - name: Same-major ESLint advisory fix; authentic lockfile
        run: |
          npm install --save-dev --save-exact eslint@9.39.5 @eslint/js@9.39.5 --ignore-scripts --no-fund 2>&1 | tee evidence/update.log
          npm ci 2>&1 | tee evidence/install.log
          npm audit --json > evidence/audit-after.json
          npm audit --omit=dev --json > evidence/audit-production-after.json
      - name: Regression validation
        env:
          GITHUB_PAGES: '1'
        run: |
          npm run typecheck 2>&1 | tee evidence/typecheck.log
          npm run lint 2>&1 | tee evidence/lint.log
          npm test 2>&1 | tee evidence/contracts.log
          npm run build 2>&1 | tee evidence/build.log
          npx playwright install --with-deps chromium
          npm run test:browser 2>&1 | tee evidence/browser.log
      - name: Publish dependency change only, guarded feature ref
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          git fetch origin feat/oss-productization-b-20260916
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: close ESLint development-only audit findings'
            git push origin HEAD:refs/heads/feat/oss-productization-b-20260916
          fi
          git rev-parse HEAD > evidence/HEAD.txt
      - name: Preserve provenance and audit output
        if: always()
        run: |
          cp package.json package-lock.json evidence/
          git archive HEAD -o evidence/source.tar.gz
          if [ -d dist ]; then tar -czf evidence/dist.tar.gz dist; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mosha-security-closure-${{ github.sha }}
          path: evidence/
          retention-days: 30
