name: Apply and verify approved OSS B source
on:
  push:
    branches: [feat/oss-productization-b-20260916]
    paths: ['.b-transport/**', '.github/workflows/apply-oss-b.yml']
permissions:
  contents: write
defaults:
  run:
    shell: bash
concurrency:
  group: apply-oss-b
  cancel-in-progress: false
jobs:
  apply-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact source within the authorized feature branch
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import hashlib,json,lzma,pathlib,subprocess,shutil
          root=pathlib.Path.cwd()
          expected='235ba13ad9edaf7f1ce8ba78f10fdadea03a4618'
          subprocess.run(['git','merge-base','--is-ancestor',expected,'HEAD'],check=True)
          blob=b''.join((root/'.b-transport'/f'{i:02}.part').read_bytes() for i in (1,2,3))
          digest=hashlib.sha256(blob).hexdigest()
          assert digest=='7a7bc334edc6998b12b9164b5f6b1b7358e495b81913e8c56a0df0e8cc92a44f',digest
          data=json.loads(lzma.decompress(blob));assert data['baseline']==expected
          def target(p):
              q=pathlib.PurePosixPath(p)
              assert not q.is_absolute() and '..' not in q.parts and q.parts[0] not in ('.git','.env','node_modules','evidence'),p
              result=root/p
              assert result.resolve().is_relative_to(root),p
              return result
          for p in [*data['files'],*data['patches'],*data['delete']]: target(p)
          for p,patch in data['patches'].items():
              subprocess.run(['git','apply','--check','-'],input=patch.encode(),check=True)
          for p in data['delete']:
              q=target(p)
              assert not q.is_dir(),p
              q.unlink(missing_ok=True)
          for p,patch in data['patches'].items():subprocess.run(['git','apply','-'],input=patch.encode(),check=True)
          for p,text in data['files'].items():
              q=target(p);q.parent.mkdir(parents=True,exist_ok=True);q.write_text(text,encoding='utf-8')
          changed={'source_transport_sha256':digest,'baseline':expected,'written':list(data['files']),'patched':list(data['patches']),'removed':data['delete']}
          (root/'evidence/change-set.json').write_text(json.dumps(changed,indent=2))
          print(json.dumps(changed,indent=2))
          shutil.rmtree(root/'.b-transport')
          (root/'.github/workflows/apply-oss-b.yml').unlink()
          PY
      - name: Generate authentic lockfile and validate clean install
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund 2>&1 | tee evidence/lock-generation.log
          npm ci 2>&1 | tee evidence/install.log
      - name: Typecheck lint contracts and build
        env:
          GITHUB_PAGES: '1'
        run: |
          npm run typecheck 2>&1 | tee evidence/typecheck.log
          npm run lint 2>&1 | tee evidence/lint.log
          npm test 2>&1 | tee evidence/contracts.log
          npm run build 2>&1 | tee evidence/build.log
          cp dist/css/mosha-card.css css/mosha-card.css
          cp dist/examples/cards.html demo/cards.html
      - name: Publish reviewable source to feature branch only (not acceptance)
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/feat/oss-productization-b-20260916'
          git fetch origin feat/oss-productization-b-20260916
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: standalone Mosha studio with safe exports and authentic lockfile'
          git push origin HEAD:refs/heads/feat/oss-productization-b-20260916
          git rev-parse HEAD > evidence/HEAD.txt
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build exact committed source
        env:
          GITHUB_PAGES: '1'
        run: npm run build 2>&1 | tee evidence/committed-build.log
      - run: npx playwright install --with-deps chromium
      - name: Real studio and generated-output browser acceptance
        run: npm run test:browser 2>&1 | tee evidence/browser.log
      - name: Preserve source reports and runnable output even on failure
        if: always()
        run: |
          git rev-parse HEAD > evidence/runner-head.txt
          tar --exclude='./node_modules' --exclude='./evidence' --exclude='./.git' --exclude='./dist' --exclude='./.react-fixture' -czf evidence/source-working-tree.tar.gz .
          if [ -d dist ]; then tar -czf evidence/dist.tar.gz dist; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mosha-B-implementation-${{ github.sha }}
          path: evidence/
          retention-days: 30
