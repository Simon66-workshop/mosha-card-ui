name: OSS baseline evidence
on:
  push:
    branches: [feat/oss-productization-b-20260916]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Archive exact source
        run: |
          mkdir -p evidence
          git archive HEAD -o evidence/source.tar.gz
          git rev-parse HEAD > evidence/HEAD.txt
          git ls-tree -r HEAD > evidence/git-tree.txt
      - run: npm ci --ignore-scripts
      - name: Baseline typecheck
        continue-on-error: true
        run: npm run typecheck 2>&1 | tee evidence/baseline-typecheck.log
      - name: Run original tests
        continue-on-error: true
        run: npm test 2>&1 | tee evidence/baseline-tests.log
      - name: Regression contracts (expected RED before implementation)
        run: node tests/contracts.mjs 2>&1 | tee evidence/contracts.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mosha-baseline-${{ github.sha }}
          path: evidence/
          retention-days: 30
