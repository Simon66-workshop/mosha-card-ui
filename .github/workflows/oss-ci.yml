name: OSS quality gates
on:
  push:
    branches: [main, feat/oss-productization-b-20260916]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: oss-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: mkdir -p evidence && git rev-parse HEAD > evidence/HEAD.txt
      - run: npm ci 2>&1 | tee evidence/install.log
      - name: Record complete and runtime-only dependency audits
        run: |
          npm audit --json > evidence/audit-all.json || true
          npm audit --omit=dev --json > evidence/audit-production.json || true
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          for(const file of ['audit-all.json','audit-production.json']) {
            const r=JSON.parse(readFileSync('evidence/'+file,'utf8'));
            if(r.error || !r.metadata?.vulnerabilities) throw new Error('Audit unavailable: '+file);
            console.log(file,JSON.stringify(r.metadata.vulnerabilities));
            if(r.metadata.vulnerabilities.total!==0) throw new Error('Unresolved dependency advisory: '+file);
          }
          JS
      - run: npm run typecheck 2>&1 | tee evidence/typecheck.log
      - run: npm run lint 2>&1 | tee evidence/lint.log
      - run: npm test 2>&1 | tee evidence/contracts.log
      - run: npm run build 2>&1 | tee evidence/build.log
        env:
          GITHUB_PAGES: '1'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser 2>&1 | tee evidence/browser.log
      - name: Preserve exact source, runtime outputs and reports
        if: always()
        run: |
          git archive HEAD -o evidence/source.tar.gz
          if [ -d dist ]; then tar -czf evidence/dist.tar.gz dist; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mosha-qa-${{ github.sha }}
          path: evidence/
          retention-days: 30
  publish-evidence:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mosha-qa-${{ github.sha }}
          path: ${{ runner.temp }}/mosha-evidence
      - name: Publish immutable-source proof, not application changes
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          dest="$RUNNER_TEMP/evidence-branch"
          if git ls-remote --exit-code --heads origin oss-evidence > /dev/null; then
            git fetch origin oss-evidence
            git worktree add --detach "$dest" FETCH_HEAD
          else
            git worktree add --detach "$dest" HEAD
            (cd "$dest" && git checkout --orphan oss-evidence && git rm -rf .)
          fi
          mkdir -p "$dest/runs/$SOURCE_SHA/screenshots"
          cp "$RUNNER_TEMP/mosha-evidence/"{HEAD.txt,contracts.json,browser.json,audit-all.json,audit-production.json,install.log,typecheck.log,lint.log,contracts.log,browser.log,build.log} "$dest/runs/$SOURCE_SHA/"
          cp "$RUNNER_TEMP/mosha-evidence/screenshots/"*.png "$dest/runs/$SOURCE_SHA/screenshots/"
          printf '# Mosha verified evidence\n\nSource: `%s`\n\nRun: https://github.com/Simon66-workshop/mosha-card-ui/actions/runs/%s\n\nRaw reports and real browser captures: [runs/%s](runs/%s). These tests are not a deployment receipt, independent third-party review, Safari/iOS certification, adoption metric or award.\n' "$SOURCE_SHA" "$RUN_ID" "$SOURCE_SHA" "$SOURCE_SHA" > "$dest/README.md"
          cd "$dest"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runs README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish verified raw evidence for $SOURCE_SHA"
            git push origin HEAD:refs/heads/oss-evidence
          fi
